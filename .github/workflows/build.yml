name: Build and Release Photon Shader

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-shader:
    name: Build Shader Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check GLSL Shader Syntax
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          echo "Validating GLSL shader syntax..."
          # Scans and checks syntax for vertex and fragment shaders
          find . -type f \( -name "*.vsh" -o -name "*.fsh" -o -name "*.glsl" \) -exec glslangValidator {} + || true

      - name: Package Shader Archive
        run: |
          mkdir -p release
          echo "Zipping Photon shader pack..."
          
          # Zips all shader files into Photon.zip while excluding Git and metadata files
          zip -r release/Photon.zip . -x "*.git*" "*.github*" "*release*" "*.md" "LICENSE" ".gitignore"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Build
          path: release/Photon.zip

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Photon.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
