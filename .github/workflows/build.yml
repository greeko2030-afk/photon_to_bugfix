name: Compile and Release Photon Shader

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-shader:
    name: Compile and Zip Shader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Installs Python to run the compiler

      - name: Compile Shader
        run: |
          echo "Running build script to compile the shader..."
          
          # IMPORTANT: Change 'build.py' if your repo uses a different script name!
          # Example: python scripts/build.py
          python build.py
          
      - name: Process and Zip Output
        run: |
          mkdir -p release
          echo "Zipping the compiled files..."
          
          # Zips the files. If your script outputs to a specific folder (like 'dist/'),
          # change the '.' to 'dist/' below.
          zip -r release/Photon.zip . -x "*.git*" "*.github*" "*release*" "*.md" "LICENSE" "build.py"

      - name: Upload Artifact for Testing
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Build
          path: release/Photon.zip

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Photon.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
