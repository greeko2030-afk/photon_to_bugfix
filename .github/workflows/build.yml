name: Build and Release Photon Shader

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-shader:
    name: Compile and Zip Shader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process and Zip Shader Files
        run: |
          mkdir -p release
          echo "Building and zipping Photon shader files..."
          
          # Zips everything in the current directory into 'Photon.zip'
          # Excludes repository management files (.git, .github) and documentation
          zip -r release/Photon.zip . -x "*.git*" "*.github*" "*release*" "*.md" "LICENSE"

      - name: Upload Artifact for Testing
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Build
          path: release/Photon.zip

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Photon.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
